<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>内容后台 · 柚</title>
    <!--
      自建单页后台（admin-v2.md E 组）：原生 JS + Vditor（CDN），无构建步骤、无框架、无配置文件。
      · 本页随站点部署在 /admin/；令牌只进浏览器 localStorage（见 js/storage.js）。
      · 图片预览走仓库原始地址（src/content 下的图片构建后不由站点按原路径服务）。
      · 唯一第三方库是 Vditor，且只在编辑页按需从 CDN 拉取；拉不到就退回纯文本编辑，页面照常可用。
    -->
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <header class="top">
      <a class="brand" href="/" title="回前台">柚 <span>· 内容后台</span></a>
      <nav class="nav" id="nav" data-testid="nav" hidden>
        <button type="button" data-nav="photos" data-testid="nav-photos">照片池</button>
        <button type="button" data-nav="series" data-testid="nav-series">系列</button>
        <button type="button" data-nav="posts" data-testid="nav-posts">随笔</button>
      </nav>
      <button type="button" class="ghost" id="logout" data-testid="logout" hidden>退出</button>
    </header>

    <main id="view" class="view"></main>

    <footer class="foot">
      <span>仓库 Elaina0510/grphyblog · 分支 main · 令牌只存在本机浏览器</span>
    </footer>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
