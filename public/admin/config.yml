# =============================================================================
# 内容后台配置（/admin）—— 引擎：Sveltia CMS（@sveltia/cms）
#
# 为什么不是 Decap：Decap 3.x 的 GitHub 后端**删掉了「直连 GitHub 登录」**，
#   只会走 Netlify 的 OAuth 代理（api.netlify.com/auth），本站托管在 Cloudflare Pages，
#   代理回 404 → 登录必然失败（已实测复现）。Sveltia 与 Decap 配置大体兼容，
#   并支持「粘贴 GitHub Access Token 直接登录」，不需要任何第三方代理或自建服务器。
#   登录步骤（生成令牌 + 粘贴）见 doc/admin-login-setup.md。
#
# 影响面：本目录（public/admin/）就是后台的全部。Astro 把 public/ 原样拷进 dist/。
#
# ✍️ 正文为什么是一个叫 body 的字段（不是"引擎自动给"）：Sveltia 把正文当成
#   `body_field.key`（默认 'body'）这个名字的字段来读写，`inline: false`（默认）时
#   序列化会把它的值从 frontmatter 里摘出来、写到 '---' 之后的正文区。
#   ➜ fields 里**不声明** body，编辑器区域就整块不出现（实测：0.221.0 加与不加的唯一差别）。
#   ➜ 声明了也不会污染 frontmatter：正文永远不进 frontmatter，strict schema 不受影响。
#
# 🔒 照片「不能从后台进来」是怎么落的（三层）：
#    1) cover 用 `widget: image` + 集合级 `media_folder: ''` / `public_folder: ''`
#       = 「条目资源」视图，只能浏览**本条目目录下已入库的**照片（实测存出来的串：
#       系列 `photos/night-01.webp`；随笔 `<标识>/photos/dawn-01.webp`，两种前台都认，
#       见 src/utils/contentImages.ts 的归一化）。`choose_url: false` 顺手关掉「输入 URL」页签。
#    2) 那个对话框仍带「上传」按钮（引擎没有"只浏览不上传"的开关），所以真正的兜底是构建期：
#    3) `npm run check-images`（scripts/check-image-sources.mjs，挂在 prebuild 上）——
#       上传的图落到 <条目>/photos/ → R3 要它出现在 photos.meta.json 里（只有 import 脚本会登记）；
#       落到别处 → R1 结构规则；落到 public/ → R5。任一条红 = Pages 构建失败 = 进不了生产。
#       照片本身只能出自本地 `npm run import`。
#
# 🖼 预览基准：前台图片 URL 规则的唯一出口是 src/utils/imageUrl.ts。
#    全局 public_folder 与其默认基准（同源根 '/'）保持一致；两个集合各自把
#    media_folder / public_folder 覆写成空串（= 相对本条目），所以封面/正文插图都按
#    「相对条目」落盘，不走全局 /uploads 前缀。
#    ➜ 改 imageUrl.ts 的基准规则时，**必须同步**复核本文件的这几处（imageUrl.ts 头部有反向互指注释）。
#
# 🖼 正文里的插图：Sveltia 富文本的「图片」块只有拖拽/浏览(上传)/粘贴三个入口，
#    **没有**"从已入库照片里挑"的列表（实测：linked_images:false、editor_components 去掉 image
#    两种写法都不行，后者连按钮都没了）。所以正文插图走右上角「以 Markdown 编辑」手写引用行，
#    形如 ![说明](photos/night-01.webp)。`npm run import` 结束时会把现成的引用行打印出来，复制即可。
#
# ✍️ 提交信息：未自定义（用 Sveltia 默认文案）。GitHub 上按作者/时间检索即可。
# =============================================================================
backend:
  name: github
  # 本站仓库（必须 Public：仓库公开，写权限靠 GitHub 令牌/协作权限挡）
  repo: Elaina0510/grphyblog
  branch: main
  # 只允许「粘贴 Access Token」登录：显式禁掉那个在本站点必然 404 的 OAuth 入口，
  # 免得再看到 "Login with GitHub → Not Found" 这种误导性流程。
  auth_methods: [token]

# 线上站点（Pages 域名）：用于「在站点中打开」等链接。
site_url: https://grphyblog.pages.dev
display_url: https://grphyblog.pages.dev

# simple = 改完即 commit 即发布（草稿与否只由 frontmatter 的 draft 决定）。
publish_mode: simple

# 全局媒体目录：Sveltia 没 media_folder 会直接报「未定义媒体文件夹」，
# 后台「全局资源」页签也用它；照片不该从这里进，落在这里会被 R5 拦在构建期。
media_folder: public/uploads
public_folder: /uploads

# -----------------------------------------------------------------------------
# 内容模型：frontmatter 字段与 src/content/schemas.ts 的 strict schema **逐字对齐**，
# 多写一个键、少写一个键都会让下一次 `npm run build` 在 zod .strict() 上崩。
# 两个刻意的例外（都由 tests/unit/decap-cms.test.ts 钉住）：
#   1) 名为 body 的正文字段：声明在 fields 里但**不进** frontmatter（见顶部 ✍️ 段）；
#   2) 系列的 order：schema 里必填，但表单里**不放**字段——它由集合的 `reorder: true`
#      自动维护（拖拽排序时重写 1..N，新建条目自动 max+1）。
# 另有「按 widget 造样本 frontmatter → 过真 schema」的往返用例兜底。
# 条目标识（系列目录名 / 随笔文件名）走路径输入框，不需要额外 slug/summary 字段。
# -----------------------------------------------------------------------------
collections:
  # ── 系列：src/content/series/<标识>/index.md ─────────────────────────────
  - name: series
    label: 系列
    label_singular: 系列条目
    folder: src/content/series
    # 一个条目 = 一个目录里的 index.md，与 Astro glob（*/index.md）一一对应。
    path: '{{slug}}/index'
    # 嵌套集合：条目列表按目录树展示；photos/ 资源夹里没有 index.md，不会被当成条目。
    nested:
      depth: 2
      summary: '{{title}}'
      subfolders: true
    # 告诉路径编辑器 index 文件名的主干是 index（<目录>/index.md）。
    meta:
      path:
        index_file: index
        label: 系列目录名（英文小写 + 连字符，如 city-lights）
    create: true
    delete: true
    extension: md
    format: yaml-frontmatter
    slug: '{{fields.title}}'
    summary: '{{fields.title}}'
    # 拖拽排序：列表页右上「重新排序条目」→ 拖动或用每行的 上移/下移 → 「完成排序」。
    # 引擎会把 1..N 的整数自动写进 frontmatter 的 `order` 键（所以表单里**不再**放 order 字段，
    # 免得人手打数字打撞号）；新建条目自动拿 max+1 接在最后，普通编辑保存不会丢掉 order。
    reorder: true
    # 封面/正文插图都按「相对本条目」处理（详见顶部 🔒 段）。
    media_folder: ''
    public_folder: ''
    fields:
      - name: title
        label: 标题
        widget: string

      - name: date
        label: 日期
        widget: datetime
        # 只选日期、按 YYYY-MM-DD 落盘（与种子内容、z.coerce.date 口径一致）。
        type: date
        format: YYYY-MM-DD
        # 避免浏览器时区把日期挪前/后一天（官方文档对 type: date 的明确提醒）。
        picker_utc: true

      - name: cover
        label: 封面（从本系列已入库照片里挑）
        widget: image
        # 关掉「输入 URL」页签：封面只能是仓库里已有的图，不能外链。
        choose_url: false
        hint: |
          点「替换」→「条目资源」页签，列表就是本系列目录下 photos/ 里已入库的照片，
          选中后存进 frontmatter 的形如 photos/night-01.webp。
          ⚠️ 新建的系列条目这一栏只有上传拖放区、没有「替换」按钮：因为照片目录还没生成。
          先回本地跑 `npm run import -- --series <系列标识>`，再进后台打开这条来挑。
          照片只能由本地 `npm run import` 生成（压缩 + 缩略图 + EXIF sidecar）；
          这个对话框里的「上传」不是通道——上传件没有 sidecar 登记，下一次构建即失败。

      - name: tags
        label: 标签
        widget: list
        field:
          name: tag
          label: 标签
          widget: string

      - name: draft
        label: 草稿开关
        widget: boolean
        default: false
        hint: 打开 = 撤下（不进线上产物，等于下线按钮）；关闭 = 发布。

      # 正文（系列手记）。必须叫 body：见顶部 ✍️ 段。放在最后 = 表单里排在最下。
      - name: body
        label: 正文（系列手记）
        widget: markdown
        required: false
        hint: |
          存进文件时是 frontmatter 之后的正文区，不会变成 frontmatter 字段。
          右上角「以 Markdown 编辑」可切到手写 Markdown；插图就在那种模式下写
          `![说明](photos/文件名.webp)`（路径抄自 `npm run import` 结束时打印的引用行）。

  # ── 随笔：src/content/posts/<日期-标题>.md（平铺不套目录；插图夹与文件同名）──
  - name: posts
    label: 随笔
    label_singular: 随笔
    folder: src/content/posts
    path: '{{slug}}'
    create: true
    delete: true
    extension: md
    format: yaml-frontmatter
    slug: '{{fields.title}}'
    summary: '{{fields.title}}'
    # 同系列：相对本条目。随笔的 .md 是平铺文件、插图夹与文件同名，
    # 实测这种形态下后台存出来是 `<标识>/photos/x.webp`（多一层，前台同样认）。
    media_folder: ''
    public_folder: ''
    fields:
      - name: title
        label: 标题
        widget: string
        hint: 新建随笔时标题建议以 YYYY-MM-DD 开头（如 2026-10-01-autumn-light），这样文件名与同名插图资源夹都能保持 ASCII；已有条目改名请连同 `npm run import -- --post <标识>` 的资源夹一起改。

      - name: date
        label: 日期
        widget: datetime
        type: date
        format: YYYY-MM-DD
        picker_utc: true

      - name: cover
        label: 封面（从本篇已入库照片里挑）
        widget: image
        choose_url: false
        hint: |
          点「替换」→「条目资源」页签，列表就是本篇同名资源夹 <日期-标题>/photos/ 里已入库的照片。
          ⚠️ 新建的随笔这一栏只有上传拖放区、没有「替换」按钮：因为插图夹还没生成。
          先回本地跑 `npm run import -- --post <日期-标题>`，再进后台打开这条来挑。
          随笔的插图资源夹与 .md 同名，由同一条 import 命令生成；
          这个对话框里的「上传」不是通道——上传件没有 sidecar 登记，下一次构建即失败。

      - name: tags
        label: 标签
        widget: list
        field:
          name: tag
          label: 标签
          widget: string

      - name: draft
        label: 草稿开关
        widget: boolean
        default: false
        hint: 打开 = 撤下（不进线上产物）；关闭 = 发布。

      # 正文（随笔内容）。必须叫 body：见顶部 ✍️ 段。
      - name: body
        label: 正文（随笔内容）
        widget: markdown
        required: false
        hint: |
          存进文件时是 frontmatter 之后的正文区，不会变成 frontmatter 字段。
          右上角「以 Markdown 编辑」可切到手写 Markdown；插图就在那种模式下写
          `![说明](<日期-标题>/photos/文件名.webp)`（路径抄自 `npm run import` 打印的引用行），
          宽高与灯箱帧序列在构建期按同名的 EXIF 登记表（sidecar）回填。
