# =============================================================================
# Decap CMS 后台配置（/admin）—— design §3「后台鉴权」+ §4「/admin 仅文字操作」
#
# 影响面：本目录（public/admin/）就是后台的全部。Astro 把 public/ 原样拷进 dist/，
# 于是线上 https://grphyblog.pages.dev/admin/ 直接就是这个页面 + 这份 config.yml。
#
# ⚠️ 停维备案（design §3）：若 Decap CMS 停止维护，迁到兼容替代 **Sveltia CMS**。
#    Sveltia 读同一份 config.yml、同一套 GitHub backend，**影响面仅 public/admin/ 本目录**
#    （换的是 index.html 里的 script 标签与个别配置键名）：
#    内容仓库 src/content/**、schema（src/content/schemas.ts）、Astro 构建一律不受波及。
#
# 🔒 照片「禁上传」是怎么落的（decap-cms 任务 6，三层）：
#    1) 本文件**任何地方都不出现 media_folder**（全站级与 collection 级都没有）。
#       Decap 的上传必须有落点目录才会写入；没有 media_folder 就没有可写落点 → 上传通道不成立。
#       只有 public_folder（纯 URL 前缀，只读引用）在配，见下面「🖼 预览基准」。
#    2) cover 字段用 `widget: string`，**不用 image widget**：后台不渲染上传区/拖拽区，
#       只能填「相对本条目的照片路径」（如 photos/night-01.webp），文件名从已入库的
#       src/content/<集合>/<条目>/photos/ 里复制。照片本身只能出自 `npm run import`。
#       （Decap 的 media_library 只有 uploadcare / cloudinary 这类**第三方上传**实现，
#        没有可靠的「只列已入库照片」实现；用 image + media_library 反而重新打开上传口，
#        故按「以当前版本实际能力为准」的口径改成 string + 构建期兜底。若将来确认某版本
#        支持只读媒体夹，可把下面「可选：只读媒体夹（未启用）」一块解开替换 cover 字段。）
#    3) 兜底检查：`npm run check-images`（scripts/check-image-sources.mjs，并挂在 prebuild 上）。
#       任何「photos/ 之外的图片」「sidecar 未登记的图片」「public/ 里的图片」都会让构建失败。
#       → 即便后台被绕过、或有人手工塞图，第二张照片通道也进不了线上产物。
#
# 🖼 预览基准（decap-cms 任务 8）：CMS 运行时是 CDN 上的 JS，**import 不到我们 Astro 的 TS 工具**，
#    所以「图片 URL 规则」在本目录里有第二份实现：`public_folder`（下面）+
#    `public/admin/index.html` 里的 `resolvePreviewUrl()`。它们必须与
#    **src/utils/imageUrl.ts** 的规则一致（绝对 http(s) 原样返回；相对路径 = base + '/' + path，
#    base 由 PUBLIC_IMAGE_BASE 决定，默认同源根 '/'）。
#    ➜ **改 imageUrl.ts 的基准规则（含 PUBLIC_IMAGE_BASE 口径）时，必须同步改 config.yml 的
#      public_folder 与 index.html 的 resolvePreviewUrl()**；imageUrl.ts 头部有指向本文件的互指注释。
#    验收：人工比对「后台预览图」与「线上图」是否同一张（见 doc/github-oauth-setup.md 末节）。
#
# 📎 登录（decap-cms 任务 3）：GitHub OAuth App 的 **implicit 流**（response_type=token），
#    不引入 Netlify 等第三方代理，也不自建后端。注册步骤与 client_id 回填位置见
#    **doc/github-oauth-setup.md**。下面 backend 里的 client_id 是**占位**，未注册前保持注释状态。
# =============================================================================

backend:
  name: github
  # 本站仓库（必须 Public：design §3「仓库公开，写权限靠 OAuth + 仓库协作权限挡」）
  repo: Elaina0510/grphyblog
  branch: main
  # implicit 流：直接在 github.com 授权，token 从 URL fragment 回来，不需要后端代理。
  auth_type: github
  # TODO: client_id 由 doc/github-oauth-setup.md 注册 OAuth App 后填入（去掉注释、替换尖括号）。
  #       只填 client_id；implicit 流**没有** client_secret，也**绝不**把 secret 写进本文件
  #       （本目录会随站点公开，任何 secret 都等于公开）。
  # client_id: <GITHUB_OAUTH_CLIENT_ID>
  commit_message: 'content(admin): update {{path}} via {{package_name}}'

# 线上站点（Pages 域名）：OAuth 回调基址与「在站点中打开」链接都用它。
site_url: https://grphyblog.pages.dev
display_url: https://grphyblog.pages.dev

# simple = 改完即 commit 即发布（草稿与否只由 frontmatter 的 draft 决定，design §4）。
# 不用 editorial/Workflow：那套要靠 Git Gateway + PR，与「GitHub OAuth 直连」的鉴权口径不符。
publish_mode: simple

# 本地验证通道：本地起 git gateway 代理（`npx decap-server`）后，用本地 dev 站点地址访问
# /admin/ 并带 `?local_backend=true`，即可对本地仓库读写、生成一次本地 commit 再 reset 丢弃。
# 仅影响本地，线上不会被它绕过 OAuth（完整步骤见 doc/github-oauth-setup.md 末节）。
local_backend: true

# 预览用的 URL 基准（只读前缀，**不是** media_folder，不产生任何上传能力）。
# 与 src/utils/imageUrl.ts 的默认 base（同源根 '/'）同口径。
public_folder: /

# -----------------------------------------------------------------------------
# 内容模型：字段集合与 src/content/schemas.ts 的 strict schema **逐字对齐**，
# 多写一个键、少写一个键都会让下一次 `npm run build` 在 zod .strict() 上崩。
# 由 tests/unit/decap-cms.test.ts 把这条对齐钉成断言（含「按 widget 造样本 frontmatter
# → 过真 schema」的往返用例）。
# 条目标识（系列目录名 / 随笔文件名）走**路径**（path + meta.path 输入框），
# 因此**不需要**额外的 slug / summary 字段——schema 里没有、也不许有。
# Markdown 正文（手记 / 随笔内容）由 Decap 编辑器自带的 body 区承担，
# 不是 field，因此不会进 frontmatter。
# -----------------------------------------------------------------------------
collections:
  # ── 系列：src/content/series/<标识>/index.md（loader glob: '*/index.md'）──────
  - name: series
    label: 系列
    label_singular: 系列条目
    folder: src/content/series
    # 一个条目 = 一个目录里的 index.md，与 glob 一一对应。
    path: '{{slug}}/index'
    # 只把「带 index.md 的目录」当条目：photos/ 资源夹与 photos.meta.json
    # 因此在后台完全不出现（design §4：sidecar 与照片后台不编辑）。
    # depth 取 2：Decap 各版本对「层数」的口径不一（有的数子目录层、有的数路径段），
    # 2 同时覆盖 <标识>/index.md 这一形态；首次线上登录时若条目列表为空，
    # 就把这里改 1 或 100 各试一次（doc/github-oauth-setup.md 第 5 节验收项）。
    nested:
      index_file: index
      depth: 2
    create: true
    delete: true
    edit: true
    extension: md
    format: frontmatter
    slug_template: '{{fields.title}}'
    # nested 条目必填：新建时由这里手填目录名，保证得到 ASCII 资源夹
    # （中文标题直接当 slug 会被转写，资源夹名会变难认）。
    meta:
      path:
        label: 系列目录名（英文小写 + 连字符，如 city-lights）
        widget: string
    summary: '{{fields.title}}'
    fields:
      - name: title
        label: 标题
        widget: string

      - name: date
        label: 日期
        widget: date
        # 与种子内容一致写成 YYYY-MM-DD（z.coerce.date 直接接受）。
        date_format: YYYY-MM-DD

      - name: cover
        label: 封面（只能选已入库照片，后台无上传口）
        widget: string
        hint: |
          填「相对本条目」的路径，例如 photos/night-01.webp。
          文件名请从 src/content/series/<本系列目录>/photos/ 里复制一份。
          照片只能由本地 `npm run import` 生成（压缩 + 缩略图 + EXIF sidecar），
          后台既没有上传按钮，也不该出现没进 sidecar 的图片。

      - name: tags
        label: 标签
        widget: list
        field:
          label: 标签
          name: tag
          widget: string
        # 下拉里带出本集合已有标签（同一份 list 字段名，纯 UI 便利，不落 frontmatter）。
        populated_from: tags

      - name: order
        label: 排序权重（数字，越小越靠前）
        widget: number
        valueType: int
        step: 1
        min: 0
        default: 1

      - name: draft
        label: 草稿开关
        widget: boolean
        default: false
        label_on: 草稿（已撤下）
        label_off: 已发布
        hint: 打开 = 撤下（不进线上产物，等于下线按钮）；关闭 = 发布。

  # ── 随笔：src/content/posts/<日期-标题>.md（loader glob: '*.md'，平铺不套目录）──
  # 用 folder 而不是 files：files 类型要在配置里逐条点名，与「新增内容只加文件」的边界①冲突。
  - name: posts
    label: 随笔
    label_singular: 随笔
    folder: src/content/posts
    path: '{{slug}}'
    create: true
    delete: true
    edit: true
    extension: md
    format: frontmatter
    slug_template: '{{fields.title}}'
    summary: '{{fields.title}}'
    fields:
      - name: title
        label: 标题
        widget: string
        hint: 新建随笔时标题建议以 YYYY-MM-DD 开头（如 2026-10-01-autumn-light），这样生成的文件名与同名插图资源夹都能保持 ASCII；已有条目改名请连同 `npm run import -- --post <标识>` 的资源夹一起改。

      - name: date
        label: 日期
        widget: date
        date_format: YYYY-MM-DD

      - name: cover
        label: 封面（只能选已入库照片，后台无上传口）
        widget: string
        hint: |
          填「相对本条目」的路径，例如 photos/dawn-01.webp。
          随笔的插图资源夹与 .md 同名（src/content/posts/<日期-标题>/photos/），
          由 `npm run import -- --post <日期-标题>` 生成；后台不能上传。

      - name: tags
        label: 标签
        widget: list
        field:
          label: 标签
          name: tag
          widget: string
        populated_from: tags

      - name: draft
        label: 草稿开关
        widget: boolean
        default: false
        label_on: 草稿（已撤下）
        label_off: 已发布
        hint: 打开 = 撤下（不进线上产物）；关闭 = 发布。

# -----------------------------------------------------------------------------
# 可选：只读媒体夹（**未启用**，Decap 当前版本无「只列已入库照片、禁止上传」的
# media_library 实现，启用下面的写法只会重新打开上传口）。留在这里，等确认某个
# 版本/替代（如 Sveltia）真有只读模式时，再把 cover 从 string 换成 image 试一次：
#
# media_library:
#   type: editorial
#   config:
#     folders:
#       - public
#
# cover 字段届时相应改为：
#   - { name: cover, label: 封面, widget: image, choose_url: false, media_library: { type: editorial } }
#
# 在确认之前，禁上传靠的是「无 media_folder + string widget + 构建期 check-images」这三层。
# -----------------------------------------------------------------------------
