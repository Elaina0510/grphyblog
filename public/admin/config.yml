# =============================================================================
# 内容后台配置（/admin）—— 引擎：Sveltia CMS（@sveltia/cms）
#
# 为什么不是 Decap：Decap 3.x 的 GitHub 后端**删掉了「直连 GitHub 登录」**，
#   只会走 Netlify 的 OAuth 代理（api.netlify.com/auth），本站托管在 Cloudflare Pages，
#   代理回 404 → 登录必然失败（已实测复现）。Sveltia 与 Decap 配置大体兼容，
#   并支持「粘贴 GitHub Access Token 直接登录」，不需要任何第三方代理或自建服务器。
#   登录步骤（生成令牌 + 粘贴）见 doc/admin-login-setup.md。
#
# 影响面：本目录（public/admin/）就是后台的全部。Astro 把 public/ 原样拷进 dist/。
#
# 🔒 照片「禁上传」是怎么落的（三层，与迁移 Decap 时同口径）：
#    1) cover 字段用 `widget: string`（不是 image）：条目表单里没有上传/拖拽控件，
#       只能填「相对本条目的照片路径」（如 photos/night-01.webp）。
#    2) media_folder 指向 public/uploads：即便有人从后台媒体库真上传了文件，
#    3) 兜底检查：`npm run check-images`（scripts/check-image-sources.mjs，并挂在 prebuild 上）
#       的 R5 规则——public/ 下不得出现图片。
#       有人真去后台媒体库上传，文件落 public/uploads，下一次 npm run build（= Pages 构建命令）
#       即失败 → 传不进生产。照片本身只能出自本地 `npm run import`。
#
# 🖼 预览基准：前台图片 URL 规则的唯一出口是 src/utils/imageUrl.ts。
#    Sveltia 的编辑器预览由它自己按 public_folder 拼 URL；本文件的 public_folder
#    与其默认基准（同源根 '/'）保持一致。➜ 改 imageUrl.ts 的基准规则时，**必须同步**改本
#    文件的 public_folder（imageUrl.ts 头部有反向互指注释）。
#
# ✍️ 提交信息：未自定义（用 Sveltia 默认文案）。GitHub 上按作者/时间检索即可。
# =============================================================================
backend:
  name: github
  # 本站仓库（必须 Public：仓库公开，写权限靠 GitHub 令牌/协作权限挡）
  repo: Elaina0510/grphyblog
  branch: main
  # 只允许「粘贴 Access Token」登录：显式禁掉那个在本站点必然 404 的 OAuth 入口，
  # 免得再看到 "Login with GitHub → Not Found" 这种误导性流程。
  auth_methods: [token]

# 线上站点（Pages 域名）：用于「在站点中打开」等链接。
site_url: https://grphyblog.pages.dev
display_url: https://grphyblog.pages.dev

# simple = 改完即 commit 即发布（草稿与否只由 frontmatter 的 draft 决定）。
publish_mode: simple

# 预览/媒体 URL 前缀（禁上传口径见顶部注释第 2/3 层）。
media_folder: public/uploads
public_folder: /uploads

# -----------------------------------------------------------------------------
# 内容模型：字段与 src/content/schemas.ts 的 strict schema **逐字对齐**，
# 多写一个键、少写一个键都会让下一次 `npm run build` 在 zod .strict() 上崩。
# 由 tests/unit/decap-cms.test.ts 钉成断言（含「按 widget 造样本 frontmatter
# → 过真 schema」的往返用例）。
# 条目标识（系列目录名 / 随笔文件名）走路径输入框，不需要额外 slug/summary 字段。
# Markdown 正文（手记 / 随笔内容）由编辑器 body 区承担，不是 field，不进 frontmatter。
# -----------------------------------------------------------------------------
collections:
  # ── 系列：src/content/series/<标识>/index.md ─────────────────────────────
  - name: series
    label: 系列
    label_singular: 系列条目
    folder: src/content/series
    # 一个条目 = 一个目录里的 index.md，与 Astro glob（*/index.md）一一对应。
    path: '{{slug}}/index'
    # 嵌套集合：条目列表按目录树展示；photos/ 资源夹里没有 index.md，不会被当成条目。
    nested:
      depth: 2
      summary: '{{title}}'
      subfolders: true
    # 告诉路径编辑器 index 文件名的主干是 index（<目录>/index.md）。
    meta:
      path:
        index_file: index
        label: 系列目录名（英文小写 + 连字符，如 city-lights）
    create: true
    delete: true
    extension: md
    format: yaml-frontmatter
    slug: '{{fields.title}}'
    summary: '{{fields.title}}'
    fields:
      - name: title
        label: 标题
        widget: string

      - name: date
        label: 日期
        widget: datetime
        # 只选日期、按 YYYY-MM-DD 落盘（与种子内容、z.coerce.date 口径一致）。
        type: date
        format: YYYY-MM-DD
        # 避免浏览器时区把日期挪前/后一天（官方文档对 type: date 的明确提醒）。
        picker_utc: true

      - name: cover
        label: 封面（只能选已入库照片，后台无上传口）
        widget: string
        hint: |
          填「相对本条目」的路径，例如 photos/night-01.webp。
          文件名请从 src/content/series/<本系列目录>/photos/ 里复制一份。
          照片只能由本地 `npm run import` 生成（压缩 + 缩略图 + EXIF sidecar），
          后台条目表单里没有上传按钮，也不该出现没进 sidecar 的图片。

      - name: tags
        label: 标签
        widget: list
        field:
          name: tag
          label: 标签
          widget: string

      - name: order
        label: 排序权重（数字，越小越靠前）
        widget: number
        value_type: int
        step: 1
        min: 0
        default: 1

      - name: draft
        label: 草稿开关
        widget: boolean
        default: false
        hint: 打开 = 撤下（不进线上产物，等于下线按钮）；关闭 = 发布。

  # ── 随笔：src/content/posts/<日期-标题>.md（平铺不套目录；插图夹与文件同名）──
  - name: posts
    label: 随笔
    label_singular: 随笔
    folder: src/content/posts
    path: '{{slug}}'
    create: true
    delete: true
    extension: md
    format: yaml-frontmatter
    slug: '{{fields.title}}'
    summary: '{{fields.title}}'
    fields:
      - name: title
        label: 标题
        widget: string
        hint: 新建随笔时标题建议以 YYYY-MM-DD 开头（如 2026-10-01-autumn-light），这样文件名与同名插图资源夹都能保持 ASCII；已有条目改名请连同 `npm run import -- --post <标识>` 的资源夹一起改。

      - name: date
        label: 日期
        widget: datetime
        type: date
        format: YYYY-MM-DD
        picker_utc: true

      - name: cover
        label: 封面（只能选已入库照片，后台无上传口）
        widget: string
        hint: |
          填「相对本条目」的路径，例如 photos/dawn-01.webp。
          随笔的插图资源夹与 .md 同名（src/content/posts/<日期-标题>/photos/），
          由 `npm run import -- --post <日期-标题>` 生成；后台条目表单不能上传。

      - name: tags
        label: 标签
        widget: list
        field:
          name: tag
          label: 标签
          widget: string

      - name: draft
        label: 草稿开关
        widget: boolean
        default: false
        hint: 打开 = 撤下（不进线上产物）；关闭 = 发布。
